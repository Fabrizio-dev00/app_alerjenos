name: allergen_scanner
description: Escáner de alérgenos en etiquetas de alimentos, todo en el dispositivo.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core_i18n:
    path: ../../packages/core_i18n
  core_ocr:
    path: ../../packages/core_ocr
  core_billing:
    path: ../../packages/core_billing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: any
  shared_preferences: ^2.5.6
  camera: ^0.12.1
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  permission_handler: ^13.0.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  lucide_icons_flutter: ^3.1.25
  speech_to_text: ^7.5.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.1
  build_runner: ^2.15.1
  sqlite3: ^3.5.2
flutter:
  uses-material-design: true
  assets:
    - assets/allergens.json
  generate: true
